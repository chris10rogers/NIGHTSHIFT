
title: NIGHTSHIFT PowerShell Web Retrieval
id: 9208f1d3-f06c-48cc-a59e-0ebbc938ee51
status: experimental
description: Detects PowerShell command lines using common web retrieval methods.
author: NIGHTSHIFT Security Lab
date: 2026-11-11
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_command:
    CommandLine|contains:
      - 'Invoke-WebRequest'
      - 'Invoke-RestMethod'
      - 'DownloadString('
      - 'DownloadFile('
      - 'iwr '
  condition: selection_image and selection_command
fields:
  - UtcTime
  - Image
  - CommandLine
  - ParentImage
  - User
  - ProcessGuid
falsepositives:
  - Administrative automation
  - Package management
  - Legitimate API requests
level: medium
tags:
  - attack.execution
  - attack.t1059.001
